<!DOCTYPE html>
<html>
<head>
    <title>Calculate Change</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
        }

        h1{
            color:#6A1B9A;
        }

        input{
            padding:8px;
            width:200px;
        }

        button{
            padding:8px 15px;
            background:#6A1B9A;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#4A148C;
        }

        #result{
            margin-top:30px;
            font-size:22px;
            line-height:1.8;
        }
    </style>

</head>

<body>

<h1>Calculate Change</h1>

<label>Enter Amount: </label>

<input type="number" id="amount">

<button onclick="calculate()">Submit</button>

<div id="result"></div>

<script>

function calculate(){

    let amount = Number(document.getElementById("amount").value);

    let notes = [1000,500,100,50,20,10,5,2,1];

    let output = "";

    for(let i=0;i<notes.length;i++){

        let count = Math.floor(amount / notes[i]);

        if(count > 0){

            output += count + " of ฿" + notes[i] + "<br>";

            amount = amount % notes[i];

        }

    }

    document.getElementById("result").innerHTML = output;

}

</script>

</body>
</html>
<button onclick="location.href='index.html'">
    Back
</button>
