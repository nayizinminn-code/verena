<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body{
            font-family: Arial;
            background:#F8F3FF;
            text-align:center;
            margin-top:100px;
        }

        .box{
            width:350px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#6A1B9A;
        }

        button{
            background:#6A1B9A;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#4A148C;
        }

        input{
            padding:8px;
            width:150px;
        }

        #result{
            color:#4A148C;
        }
    </style>

</head>

<body>

<div class="box">

<h1>Grade Calculator</h1>

<input type="number" id="score" placeholder="Enter score">

<br><br>

<button onclick="calculateGrade()">Calculate</button>

<h2 id="result"></h2>

</div>

<script>

function calculateGrade(){

    let score = Number(document.getElementById("score").value);
    let grade;

    if(score >= 85){
        grade = "A";
    }
    else if(score >= 75){
        grade = "B";
    }
    else if(score >= 65){
        grade = "C";
    }
    else if(score >= 55){
        grade = "D";
    }
    else{
        grade = "F";
    }

    document.getElementById("result").innerHTML =
    "Your Grade is: " + grade;

}

</script>

</body>
</html>
<button onclick="location.href='index.html'">
    Back
</button>
